<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的足迹地图</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>我的足迹地图</h1>
      <div class="header-switches">
        <div class="view-switch" role="group" aria-label="地图范围">
          <button class="view-btn" data-view="china" type="button">中国地图</button>
          <button class="view-btn" data-view="world" type="button">世界地图</button>
        </div>
        <div id="chinaModeSwitch" class="mode-switch" role="group" aria-label="地图点亮模式">
          <button class="mode-btn" data-mode="off" type="button">普通模式</button>
          <button class="mode-btn" data-mode="province" type="button">省份点亮</button>
          <button class="mode-btn" data-mode="city" type="button">仅点亮城市</button>
        </div>
        <div class="auth-widget">
          <button id="authOpenBtn" class="auth-btn" type="button">登录 / 注册</button>
          <div id="authStatus" class="auth-status hidden">
            <span id="authEmail" class="auth-email"></span>
            <button id="authLogoutBtn" class="auth-logout-btn" type="button">退出</button>
          </div>
        </div>
      </div>
    </header>

    <div id="authModalOverlay" class="auth-modal-overlay hidden">
      <div class="auth-modal">
        <button id="authCloseBtn" class="auth-modal-close" type="button" aria-label="关闭">×</button>
        <h2>登录 / 注册</h2>
        <p class="auth-modal-desc">
          登录后，你点亮的城市/国家会保存到云端；换设备、清浏览器缓存后重新登录即可找回。不登录也完全可以正常使用，数据只存在本机。
        </p>
        <input id="authEmailInput" class="auth-input" type="email" placeholder="邮箱" autocomplete="email" />
        <input id="authPasswordInput" class="auth-input" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
        <div class="auth-modal-actions">
          <button id="authLoginBtn" class="confirm-btn" type="button">登录</button>
          <button id="authSignupBtn" class="secondary-btn" type="button">注册新账号</button>
        </div>
        <p id="authMessage" class="auth-message"></p>
      </div>
    </div>

    <main class="layout">
      <section class="map-section">
        <div id="mapContainer" class="map-container">
          <div id="mapLoading" class="map-loading">地图加载中…</div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h2 id="searchPanelTitle">添加到访城市</h2>
          <div class="search-box">
            <input
              id="citySearchInput"
              type="text"
              placeholder="输入城市名，如：杭州"
              autocomplete="off"
            />
            <div id="suggestList" class="suggest-list hidden"></div>
          </div>
          <button id="confirmAddBtn" class="confirm-btn" type="button" disabled>
            确认添加
          </button>
          <p id="searchHint" class="hint"></p>
        </div>

        <div class="panel stats-panel">
          <div class="stat">
            <div class="stat-value" id="itemCount">0</div>
            <div class="stat-label" id="itemCountLabel">到访城市</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="groupCount">0</div>
            <div class="stat-label" id="groupCountLabel">覆盖省份</div>
          </div>
        </div>

        <div class="panel visited-panel">
          <h2 id="visitedPanelTitle">已点亮城市</h2>
          <ul id="visitedList" class="visited-list">
            <li class="empty-tip">还没有添加城市，快去点亮地图吧～</li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="js/vendor/echarts.min.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/cities-data.js"></script>
  <script src="js/province-labels-data.js"></script>
  <script src="js/countries-data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
