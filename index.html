<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的中国足迹地图</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>我的中国足迹地图</h1>
      <div class="mode-switch" role="group" aria-label="地图点亮模式">
        <button class="mode-btn" data-mode="off" type="button">普通模式</button>
        <button class="mode-btn" data-mode="province" type="button">省份点亮</button>
        <button class="mode-btn" data-mode="city" type="button">仅点亮城市</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-section">
        <div id="mapContainer" class="map-container">
          <div id="mapLoading" class="map-loading">地图加载中…</div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h2>添加到访城市</h2>
          <div class="search-box">
            <input
              id="citySearchInput"
              type="text"
              placeholder="输入城市名，如：杭州"
              autocomplete="off"
            />
            <div id="suggestList" class="suggest-list hidden"></div>
          </div>
          <button id="confirmAddBtn" class="confirm-btn" type="button" disabled>
            确认添加
          </button>
          <p id="searchHint" class="hint"></p>
        </div>

        <div class="panel stats-panel">
          <div class="stat">
            <div class="stat-value" id="cityCount">0</div>
            <div class="stat-label">到访城市</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="provinceCount">0</div>
            <div class="stat-label">覆盖省份</div>
          </div>
        </div>

        <div class="panel visited-panel">
          <h2>已点亮城市</h2>
          <ul id="visitedList" class="visited-list">
            <li class="empty-tip">还没有添加城市，快去点亮地图吧～</li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="js/vendor/echarts.min.js"></script>
  <script src="js/cities-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
